<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Power BI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            padding: 80px 40px;
            text-align: center;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #e0e7ff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            color: #cbd5e1;
            max-width: 700px;
            margin: 0 auto 40px;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);
        }

        /* Filter Section */
        .filter-container {
            padding: 40px;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .filter-btn {
            padding: 10px 24px;
            border: 2px solid rgba(148, 163, 184, 0.3);
            background: rgba(148, 163, 184, 0.05);
            color: #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.2);
            color: #e0e7ff;
        }

        /* Gallery Section */
        .gallery {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .project-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            border-color: #6366f1;
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.2);
            transform: translateY(-8px);
        }

        .project-thumbnail {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .project-content {
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .project-badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
            width: fit-content;
        }

        .project-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        .project-description {
            color: #cbd5e1;
            margin-bottom: 16px;
            flex-grow: 1;
            font-size: 0.95rem;
        }

        .project-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tech-tag {
            padding: 4px 10px;
            background: rgba(51, 65, 85, 0.8);
            color: #94a3b8;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .view-btn {
            padding: 10px 16px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .view-btn:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: #6366f1;
            color: #e0e7ff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 30px 40px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .close-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #f1f5f9;
        }

        .modal-body {
            padding: 40px;
        }

        .embed-container {
            width: 100%;
            min-height: 600px;
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .embed-container iframe {
            width: 100%;
            height: 600px;
            border: none;
        }

        .project-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .detail-box {
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 1rem;
            color: #e0e7ff;
            font-weight: 500;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid rgba(51, 65, 85, 0.3);
            color: #94a3b8;
            margin-top: 60px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                max-width: 100%;
            }

            .hero {
                padding: 40px 20px;
            }

            .filter-container {
                padding: 20px;
            }

            .gallery {
                padding: 0 20px;
            }
        }

        .no-results {
            text-align: center;
            padding: 60px 40px;
            color: #94a3b8;
        }

        .no-results h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <h1>Portfólio Power BI</h1>
        <p>Análise de dados e visualizações interativas para impulsionar decisões estratégicas</p>
        <a href="#projects" class="cta-button">Explorar Projetos</a>
    </section>

    <!-- Filter Section -->
    <section class="filter-container">
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterProjects('all')">Todos os Projetos</button>
            <button class="filter-btn" onclick="filterProjects('App de comida')">Ifood</button>
            <button class="filter-btn" onclick="filterProjects('E-commerce')">E-commerce</button>
            <button class="filter-btn" onclick="filterProjects('Campeonado Brasileiro')">Campeonado Brasileiro</button>
            <!-- <button class="filter-btn" onclick="filterProjects('operacional')">Operacional</button> -->
        </div>
    </section>

    <!-- Gallery -->
    <section class="gallery" id="projects">
        <div class="gallery-grid" id="projectsGrid"></div>
    </section>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Projeto</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="embed-container" id="embedContainer"></div>
                <div class="project-details" id="modalDetails"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Portfólio Power BI. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Dados dos projetos
        const projects = [
            {
                id: 1,
                title: "Dashboard Ifood",
                category: "App de comida",
                emoji: "📊",
                description: "Análise completa de insight e metricas do Ifood",
                tools: ["Power BI", "SQL", "DAX"],
                period: "Jan 2026",
                metrics: "150+ Métricas",
                embedUrl: "https://app.powerbi.com/view?r=eyJrIjoiMjZiNDNjMjUtNjVkMi00OWNmLThkZjQtNzMwN2M4MGMzYjNlIiwidCI6IjU5N2RkMTNlLWIzZDAtNGVhNy1hNTQwLTQ2YmJmMzZjMmMyMyJ9",
                details: {
                    client: "App do Ifood",
                    results: "+35% crescimento",
                    team: "1 pessoa"
                }
            },
            {
                id: 2,
                title: "E-commerce",
                category: "E-commerce",
                emoji: "👥",
                description: "Dashboard para insight de ecommerce ",
                tools: ["Power BI", "CSV", "DAX"],
                period: "Mar 2026",
                metrics: "60+ Métricas",
                embedUrl: "https://app.powerbi.com/view?r=eyJrIjoiMzI3NDIwODgtMTViMi00NGM2LTgzNGEtMGYyODdhMWY4ZjViIiwidCI6IjU5N2RkMTNlLWIzZDAtNGVhNy1hNTQwLTQ2YmJmMzZjMmMyMyJ9",
                details: {
                    client: "Tech Startup",
                    results: "Campanhas de marketing do produtos mais rentáveis ",
                    team: "1 pessoa"
                }
            },
            {
                id: 3,
                title: "Projeto sobre campeonado Brasileiro",
                category: "Campeonado Brasileiro",
                emoji: "👥",
                description: "",
                tools: ["Power BI", "CSV", "DAX"],
                period: "Mar 2026",
                metrics: "",
                embedUrl: "https://app.powerbi.com/view?r=eyJrIjoiMTI0YTkwZDAtODA1YS00YWZlLWIwZmQtZGMzNTRmYWUzMzk2IiwidCI6IjU5N2RkMTNlLWIzZDAtNGVhNy1hNTQwLTQ2YmJmMzZjMmMyMyJ9",
                details: {
                    client: "",
                    results: "",
                    team: "1 pessoa"
                }
            },  
            {
                id: 4,
                title: "Projeto sobre campeonado Brasileiro",
                category: "Campeonado Brasileiro",
                emoji: "🐍",
                description: "",
                tools: [],
                period: "Mar 2026",
                metrics: "",
                embedUrl: "grafico.png",
                details: {
                    client: "",
                    results: "",
                    team: "1 pessoa"
                }
            }            
          ];

        // Renderizar projetos
        function renderProjects(filter = 'all') {
            const grid = document.getElementById('projectsGrid');
            let filtered = filter === 'all' 
                ? projects 
                : projects.filter(p => p.category === filter);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results" style="grid-column: 1/-1;"><h3>Nenhum projeto encontrado</h3><p>Tente outro filtro</p></div>';
                return;
            }

            grid.innerHTML = filtered.map(project => `
                <div class="project-card" onclick="openModal(${project.id})">
                    <div class="project-thumbnail">${project.emoji}</div>
                    <div class="project-content">
                        <span class="project-badge">${project.category.charAt(0).toUpperCase() + project.category.slice(1)}</span>
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-description">${project.description}</p>
                        <div class="project-meta">
                            ${project.tools.map(tool => `<span class="tech-tag">${tool}</span>`).join('')}
                        </div>
                        <button class="view-btn" onclick="openModal(${project.id})">Ver Projeto →</button>
                    </div>
                </div>
            `).join('');
        }

        // Filtrar projetos
        function filterProjects(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderProjects(category);
        }

        // Abrir modal
        function openModal(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            document.getElementById('modalTitle').textContent = project.title;
            
            document.getElementById('embedContainer').innerHTML = `
                <iframe src="${project.embedUrl}" allowfullscreen></iframe>
            `;

            document.getElementById('modalDetails').innerHTML = `
                <div class="detail-box">
                    <div class="detail-label">Período</div>
                    <div class="detail-value">${project.period}</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Métricas</div>
                    <div class="detail-value">${project.metrics}</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Cliente</div>
                    <div class="detail-value">${project.details.client}</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Resultados</div>
                    <div class="detail-value">${project.details.results}</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Time</div>
                    <div class="detail-value">${project.details.team}</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Tecnologias</div>
                    <div class="detail-value">${project.tools.join(', ')}</div>
                </div>
            `;

            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Fechar modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Fechar ao clicar fora
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) {
                closeModal();
            }
        });

        // Renderizar na carga
        renderProjects();
    </script>
</body>
</html>
